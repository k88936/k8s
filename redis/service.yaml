apiVersion: v1
kind: Service
metadata:
  name: juicefs-redis
  namespace: redis
  labels:
    app.kubernetes.io/instance: juicefs-redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: master
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/instance: juicefs-redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: master
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis
      nodePort: 30638
