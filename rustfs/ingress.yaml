---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rustfs-cert
  namespace: rustfs
spec:
  secretName: rustfs-tls
  dnsNames:
  - rustfs.k88936.top
  - '*.rustfs.k88936.top'
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: rustfs-timeouts
  namespace: rustfs
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 0
    idleConnTimeout: 120s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rustfs-redirect
  namespace: rustfs
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rustfs-headers
  namespace: rustfs
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
    accessControlAllowOriginList:
    - "*"
    accessControlAllowMethods:
    - GET
    - PUT
    - POST
    - DELETE
    - HEAD
    - OPTIONS
    accessControlAllowHeaders:
    - "*"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rustfs-redirect
  namespace: rustfs
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`rustfs.k88936.top`) || HostRegexp(`.+\.rustfs\.k88936\.top`)
    middlewares:
    - name: rustfs-redirect
    services:
    - name: rustfs
      namespace: rustfs
      port: api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rustfs-api
  namespace: rustfs
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`rustfs.k88936.top`) || HostRegexp(`.+\.rustfs\.k88936\.top`)
    middlewares:
    - name: rustfs-headers
    services:
    - name: rustfs
      namespace: rustfs
      port: api
      passHostHeader: true
      scheme: http
      serversTransport: rustfs-timeouts
  tls:
    secretName: rustfs-tls