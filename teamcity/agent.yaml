apiVersion: v1
kind: ConfigMap
metadata:
  name: teamcity-agent-config
  namespace: teamcity
data:
  SERVER_URL: "http://teamcity.teamcity:8111"
  HTTP_PROXY: &proxyUrl "http://wallence.wallence.svc.cluster.local:7890"
  HTTPS_PROXY: *proxyUrl
  http_proxy: *proxyUrl
  https_proxy: *proxyUrl
  NO_PROXY: &noProxy "localhost,127.0.0.1,::1,.local,.svc,.svc.cluster.local,teamcity.teamcity,teamcity.k88936.top"
  no_proxy: *noProxy
  JAVA_TOOL_OPTIONS: &jvmProxy "-Dhttp.proxyHost=wallence.wallence.svc.cluster.local -Dhttp.proxyPort=7890 -Dhttps.proxyHost=wallence.wallence.svc.cluster.local -Dhttps.proxyPort=7890 -Dhttp.nonProxyHosts=localhost|127.0.0.1|*.local|*.svc|*.svc.cluster.local|teamcity.teamcity|teamcity.k88936.top"
  GRADLE_OPTS: *jvmProxy
---
apiVersion: v1
kind: Service
metadata:
  name: teamcity-agent-headless
  namespace: teamcity
  labels:
    app: teamcity-agent
spec:
  clusterIP: None
  selector:
    app: teamcity-agent
  ports:
    - name: agent
      port: 9090
      targetPort: 9090


---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: teamcity-agent
  labels:
    app: teamcity-agent
  namespace: teamcity
spec:
  serviceName: teamcity-agent-headless
  selector:
    matchLabels:
      app: teamcity-agent
  template:
    metadata:
      labels:
        app: teamcity-agent
    spec:
      containers:
        - name: app
          image: kvtodev/teamcity-agent:latest
          imagePullPolicy: Always
          securityContext:
            privileged: true
          envFrom:
            - configMapRef:
                name: teamcity-agent-config
          volumeMounts:
            - name: cache
              mountPath: /cache
              subPath: cache
            - name: cache
              mountPath: /var/lib/containers
              subPath: podman
            - name: conf
              mountPath: /data/conf
            - name: tmp
              mountPath: /opt/buildagent/temp/buildTmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Gi
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-storage
        resources:
          requests:
            storage: 128Gi
        selector:
          matchLabels:
            type: teamcity-agent-cache
    - metadata:
        name: conf
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 128Mi
