---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudreve
  namespace: cloudreve
spec:
  serviceName: cloudreve
  replicas: 1
  selector:
    matchLabels:
      app: cloudreve
  template:
    metadata:
      labels:
        app: cloudreve
    spec:
      containers:
        - name: cloudreve
          image: cloudreve/cloudreve@latest
          imagePullPolicy: Always
          ports:
            - name: container-port
              containerPort: 5212
          volumeMounts:
            - name: data
              mountPath: /cloudreve/data
            - name: postgresql-config
              mountPath: /cloudreve/data/conf.ini
              subPath: conf.ini
              readOnly: true
      volumes:
        - name: postgresql-config
          secret:
            secretName: cloudreve-postgresql
            defaultMode: 0400
            items:
              - key: conf.ini
                path: conf.ini
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 64Gi
        storageClassName: longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: cloudreve
  namespace: cloudreve
  labels:
    app: cloudreve
spec:
  ports:
    - name: service-port
      port: 80
      targetPort: container-port
  selector:
    app: cloudreve
