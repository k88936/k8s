# Host-level SMART self-test schedule. Health polling and alerting are handled
# by smartctl-exporter in Kubernetes; smartd is kept for scheduled self-tests.
#
# Short self-test daily at 02:00, staggered by one hour (maximum six hours).
# Long self-test on the first day of each month at 03:00, staggered by six
# hours (maximum 24 hours) so the old SAS disks do not test concurrently.
#
# iSCSI LUNs are intentionally not listed.

