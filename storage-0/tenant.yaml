apiVersion: rustfs.com/v1alpha1
kind: Tenant
metadata:
  name: tenant-0
  namespace: storage-0
spec:
  env:
  - name: RUSTFS_OBJECT_LOCK_ACQUIRE_TIMEOUT
    value: "20"
  - name: RUSTFS_HEAL_MRF_ENABLE
    value: "false"
  pools:
  - name: pool-0
    servers: 4
    persistence:
      volumesPerServer: 3
      volumeClaimTemplate:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 512Gi
        selector:
          matchLabels:
            type: boom
        storageClassName: local-storage
  image: rustfs/rustfs:1.0.4
  mountPath: /data
  credsSecret:
    name: rustfs-tenant-creds
  rpcSecret:
    name: rustfs-tenant-creds
    key: rpc-secret
