apiVersion: v1
kind: Service
metadata:
  name: tenant-0-io-nodeport
  namespace: storage-0
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    rustfs.tenant: tenant-0
  ports:
    - name: http-rustfs
      protocol: TCP
      port: 9000
      targetPort: 9000
      nodePort: 30900
