---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: storage0-k88936-top
  namespace: storage-0
spec:
  secretName: storage0-tls
  dnsNames:
  - storage0.k88936.top
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: storage0-timeouts
  namespace: storage-0
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 0
    idleConnTimeout: 120s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: storage0-https-redirect
  namespace: storage-0
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: storage0-headers
  namespace: storage-0
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
    accessControlAllowOriginList:
    - "*"
    accessControlAllowMethods:
    - GET
    - PUT
    - POST
    - DELETE
    - HEAD
    - OPTIONS
    accessControlAllowHeaders:
    - "*"
    accessControlExposeHeaders:
    - ETag
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: storage0-api-http
  namespace: storage-0
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`storage0.k88936.top`)
    middlewares:
    - name: storage0-https-redirect
    services:
    - name: tenant-0-io
      port: 9000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: storage0-api
  namespace: storage-0
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`storage0.k88936.top`)
    middlewares:
    - name: storage0-headers
    services:
    - name: tenant-0-io
      port: 9000
      passHostHeader: true
      scheme: http
      serversTransport: storage0-timeouts
  tls:
    secretName: storage0-tls
